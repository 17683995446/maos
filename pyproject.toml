[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maos"
version = "3.0.0"
description = "Multi-Agent Orchestration System - 企业级多Agent编排系统"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MAOS Development Team"}
]
keywords = ["agent", "orchestration", "multi-agent", "automation", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
full = [
    "redis>=5.0.0",
    "prometheus-client>=0.17.0",
    "pytest>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
maos = "maos.cli:cli"

[project.urls]
Homepage = "https://github.com/maos/maos"
Documentation = "https://maos.readthedocs.io/"
Repository = "https://github.com/maos/maos"
Issues = "https://github.com/maos/maos/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["maos*"]

[tool.pytest.ini_options]
testpaths = ["maos/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["maos"]
omit = ["*/tests/*", "*/examples/*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = []

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
