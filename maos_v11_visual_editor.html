<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAOS v11.0 - 可视化工作流编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/reactflow@11/dist/umd/index.production.min.js"></script>
    <script src="https://unpkg.com/@reactflow/core@11/dist/umd/index.production.min.js"></script>
    <script src="https://unpkg.com/@reactflow/controls@11/dist/umd/index.production.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        #root {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 自定义节点样式 */
        .workflow-node {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 15px;
            min-width: 160px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .workflow-node.selected {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.2);
        }

        .workflow-node:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .node-header {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .node-type {
            font-size: 12px;
            color: #64748b;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 320px;
            background: white;
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }

        .node-library-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.2s;
        }

        .node-library-item:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .node-library-item:active {
            cursor: grabbing;
        }

        /* AI助手面板 */
        .ai-assistant-panel {
            width: 400px;
            background: #f8fafc;
            border-left: 1px solid #e2e8f0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .chat-message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
        }

        .chat-message.user {
            background: #667eea;
            color: white;
        }

        .chat-message.assistant {
            background: white;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            align-items: center;
        }

        .toolbar-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .toolbar-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* 属性面板 */
        .property-panel {
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }

        .property-group {
            margin-bottom: 20px;
        }

        .property-label {
            font-weight: 600;
            font-size: 14px;
            color: #334155;
            margin-bottom: 6px;
        }

        .property-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .property-input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 执行状态指示器 */
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-idle { background: #94a3b8; }
        .status-running { background: #fbbf24; animation: pulse 1.5s infinite; }
        .status-completed { background: #22c55e; }
        .status-failed { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 侧边栏标题 */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // 节点类型定义
        const nodeTypes = {
            start: { icon: '▶️', name: '开始', color: '#22c55e', default: true },
            end: { icon: '⏹️', name: '结束', color: '#ef4444', default: true },
            task: { icon: '📝', name: '任务', color: '#3b82f6' },
            llm: { icon: '🧠', name: 'LLM', color: '#8b5cf6' },
            api_call: { icon: '🌐', name: 'API调用', color: '#06b6d4' },
            data_transform: { icon: '🔄', name: '数据转换', color: '#f59e0b' },
            condition: { icon: '🔀', name: '条件判断', color: '#ec4899' },
            parallel: { icon: '⚡', name: '并行执行', color: '#10b981' },
            loop: { icon: '🔁', name: '循环', color: '#f97316' },
        };

        class VisualEditor {
            constructor() {
                this.nodes = [
                    { id: 'start', type: 'start', position: { x: 100, y: 200 }, data: { label: '开始', icon: '▶️' } },
                    { id: 'task1', type: 'task', position: { x: 350, y: 150 }, data: { label: '数据处理', icon: '📝' } },
                    { id: 'llm1', type: 'llm', position: { x: 600, y: 200 }, data: { label: 'LLM处理', icon: '🧠' } },
                    { id: 'end', type: 'end', position: { x: 850, y: 200 }, data: { label: '结束', icon: '⏹️' } },
                ];

                this.edges = [
                    { id: 'e1', source: 'start', target: 'task1' },
                    { id: 'e2', source: 'task1', target: 'llm1' },
                    { id: 'e3', source: 'llm1', target: 'end' },
                ];

                this.chatHistory = [];

                this.initApp();
            }

            initApp() {
                this.renderApp();
            }

            renderApp() {
                const app = document.getElementById('root');

                app.innerHTML = `
                    <div style="display: flex; flex-direction: column; height: 100vh; width: 100%;">
                        <!-- 顶部工具栏 -->
                        <div class="toolbar">
                            <div style="font-size: 24px; font-weight: bold; margin-right: auto;">
                                🚀 MAOS v11.0 - 可视化编辑器</div>
                            <button class="toolbar-btn" onclick="editor.saveWorkflow()">💾 保存</button>
                            <button class="toolbar-btn" onclick="editor.runWorkflow()">▶️ 运行</button>
                            <button class="toolbar-btn" style="background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);"
                                    onclick="editor.openAIAssistant()">🧠 AI助手</button>
                            <button class="toolbar-btn" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);"
                                    onclick="editor.importTemplate()">📋 导入模板</button>
                        </div>

                        <!-- 主内容区 -->
                        <div style="display: flex; flex: 1; overflow: hidden;">
                            <!-- 左侧属性面板 -->
                            <div class="property-panel">
                                <div class="section-title">⚙️ 属性面板</div>

                                <div class="property-group">
                                    <div class="property-label">工作流名称</div>
                                    <input type="text" class="property-input" value="我的工作流" id="workflowName">
                                </div>

                                <div class="property-group">
                                    <div class="property-label">描述</div>
                                    <textarea class="property-input" style="min-height: 80px" placeholder="描述工作流">这是一个示例工作流</textarea>
                                </div>

                                <hr style="border-color: #e2e8f0; margin: 20px 0;">

                                <div class="section-title">📊 状态信息</div>

                                <div style="background: #f0f9ff; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
                                    <div style="font-weight: 600; margin-bottom: 6px;">节点数: <span id="nodeCount">${this.nodes.length}</span></div>
                                    <div style="font-weight: 600;">连接数: <span id="edgeCount">${this.edges.length}</span></div>
                                </div>
                            </div>

                            <!-- 中间画布 -->
                            <div style="flex: 1; background: #f8fafc; overflow: hidden;">
                                <div style="display: flex; flex-direction: column; height: 100%;">
                                    <div style="display: flex; gap: 10px; padding: 10px; background: white; border-bottom: 1px solid #e2e8f0;">
                                        <div class="section-title">📦 节点库</div>
                                        <div style="display: flex; gap: 8px; flex-wrap: wrap; flex: 1;">
                                            ${Object.entries(nodeTypes).map(([type, config]) => `
                                                <div class="node-library-item" draggable="true" data-type="${type}">
                                                    <span style="font-size: 18px; margin-right: 8px;">${config.icon}</span>
                                                    <span style="font-weight: 600;">${config.name}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <!-- 简单的SVG画布 -->
                                    <svg id="workflowCanvas" style="flex: 1; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea08 0%, #764ba208 100%);"></svg>
                                </div>
                            </div>

                            <!-- 右侧AI助手 -->
                            <div class="ai-assistant-panel">
                                <div style="padding: 16px; background: white; border-bottom: 1px solid #e2e8f0;">
                                    <div style="font-weight: 700; font-size: 18px;">🧠 AI助手</div>
                                    <div style="font-size: 12px; color: #64748b;">基于SiliconFlow · DeepSeek</div>
                                </div>

                                <div style="flex: 1; overflow-y: auto; padding: 16px;" id="chatArea">
                                    <div class="chat-message assistant">
                                        <div style="font-weight: 600; margin-bottom: 8px;">🤖 AI助手</div>
                                        <div style="font-size: 14px; line-height: 1.5;">你好！我是你的AI助手。我可以帮你：<br><br>
                                        • 生成工作流<br>
                                        • 优化现有工作流<br>
                                        • 生成代码<br>
                                        • 分析错误</div>
                                    </div>
                                </div>

                                <div style="padding: 16px; background: white; border-top: 1px solid #e2e8f0;">
                                    <textarea id="aiInput" placeholder="输入你的需求..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; resize: none; height: 100px;" rows="3"></textarea>
                                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                                        <button class="toolbar-btn" style="width: 100%;" onclick="editor.sendAIMessage()">发送</button>
                                    </div>
                                    <div style="display: flex; gap: 6px; margin-top: 8px;">
                                        <button style="flex: 1; padding: 6px 12px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer;" onclick="editor.quickAsk('生成数据处理工作流')">数据处理</button>
                                        <button style="flex: 1; padding: 6px 12px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer;" onclick="editor.quickAsk('生成LLM工作流')">LLM工作流</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                this.renderWorkflow();
            }

            renderWorkflow() {
                const canvas = document.getElementById('workflowCanvas');

                let svgContent = '';

                for (const edge of this.edges) {
                    const fromNode = this.nodes.find(n => n.id === edge.source);
                    const toNode = this.nodes.find(n => n.id === edge.target);

                    if (fromNode && toNode) {
                        const x1 = fromNode.position.x + 80;
                        const y1 = fromNode.position.y + 40;
                        const x2 = toNode.position.x;
                        const y2 = toNode.position.y + 40;

                        svgContent += `
                            <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
                                  stroke="#64748b" stroke-width="2" />
                            <polygon points="${x2-10},${y2-5} ${x2},${y2} ${x2-10},${y2+5}"
                                      fill="#64748b" />
                        `;
                    }
                }

                for (const node of this.nodes) {
                    const config = nodeTypes[node.type] || { icon: '📦', name: node.type };
                    const bgColor = config.color || '#667eea';

                    svgContent += `
                        <g class="workflow-node" style="transform: translate(${node.position.x}, ${node.position.y});">
                            <rect width="160" height="80" rx="10" fill="white" stroke="${bgColor}" stroke-width="2" />
                            <circle cx="20" cy="40" r="18" fill="${bgColor}33" stroke="${bgColor}" />
                            <text x="30" y="45" font-size="20">${config.icon}</text>
                            <text x="55" y="45" font-size="14" font-weight="600" fill="#1e293b">${node.data.label}</text>
                            <text x="55" y="65" font-size="12" fill="#64748b">${node.type}</text>
                        </g>
                    `;
                }

                canvas.innerHTML = svgContent;
            }

            sendAIMessage() {
                const input = document.getElementById('aiInput');
                const chatArea = document.getElementById('chatArea');

                if (this.chatHistory.push({ role: 'user', content: input.value });

                chatArea.innerHTML += `
                    <div class="chat-message user">
                        <div style="font-weight: 600; margin-bottom: 8px;">你</div>
                        <div style="font-size: 14px; line-height: 1.5;">${input.value}</div>
                    </div>
                `;

                chatArea.scrollTop = chatArea.scrollHeight;

                const assistantResponse = this.chatHistory.push({ role: 'assistant', content: '好的，我正在处理这个需求！让我为你生成相应的工作流。' });

                chatArea.innerHTML += `
                    <div class="chat-message assistant">
                        <div style="font-weight: 600; margin-bottom: 8px;">🤖 AI助手</div>
                        <div style="font-size: 14px; line-height: 1.5;">好的！让我为你生成工作流。</div>
                    </div>
                `;

                input.value = '';
            }

            quickAsk(prompt) {
                document.getElementById('aiInput').value = prompt;
                this.sendAIMessage();
            }

            saveWorkflow() {
                alert('工作流已保存！');
            }

            runWorkflow() {
                alert('工作流开始运行...');
            }

            openAIAssistant() {
                const panel = document.querySelector('.ai-assistant-panel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            }

            importTemplate() {
                alert('导入模板功能');
            }
        }

        const editor = new VisualEditor();
    </script>
</body>
</html>
